## 3. GitOps — How Config Changes Reach Kong

No one runs `deck sync` from their laptop. Ever.

```
Developer edits kong.yml
        │
        ▼
git push → Pull Request opened
        │
        ▼
CI runs:
  deck gateway validate kong.yml     ← is the YAML valid?
  deck gateway diff                  ← what exactly will change?
        │
        ▼
Team reviews the diff in the PR
        │
        ▼
PR merged to main
        │
        ▼
CD runs:
  deck gateway sync kong.yml
        │
        ▼
Kong Admin API receives changes
        │
        ▼
PostgreSQL updated
        │
        ▼
All Kong nodes pick up new config within seconds
        │
        ▼
Zero downtime. Zero restarts. Full audit trail in Git.
```

```yaml
# .github/workflows/kong-sync.yml
name: Kong Config Sync
on:
  push:
    branches: [main]
    paths: ['kong.yml']

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install decK
        run: |
          curl -sL https://github.com/kong/deck/releases/download/v1.37.0/deck_1.37.0_linux_amd64.tar.gz -o deck.tar.gz
          tar -xf deck.tar.gz -C /tmp && sudo cp /tmp/deck /usr/local/bin/

      - name: Validate
        run: deck gateway validate kong.yml

      - name: Diff
        run: deck gateway diff kong.yml --kong-addr ${{ secrets.KONG_ADMIN_URL }}

      - name: Sync
        run: deck gateway sync kong.yml --kong-addr ${{ secrets.KONG_ADMIN_URL }}
```

`KONG_ADMIN_URL` is a GitHub secret pointing to the internal admin endpoint.
Port 8001 is never exposed to the internet.

