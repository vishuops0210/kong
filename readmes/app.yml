## 5. The Recommendation

```
EC2 + ALB + ASG
  Works. But scaling takes 3–5 minutes.
  Self-healing is slow. Rolling updates are manual.
  Right choice only if the team is not ready for Kubernetes.

ECS Fargate
  Zero node management — AWS handles the infra.
  Scales in ~30 seconds. Native Secrets Manager integration.
  Good stepping stone. But no Helm, no K8s RBAC, no PDB,
  limited observability without extra setup.

EKS + HPA  ← THE ANSWER
  Kong pods scale in ~10 seconds on a traffic spike.
  Pod crashes → Kubernetes restarts in ~10 seconds.
  AZ fails → 2 pods in other AZs keep serving, HPA adds replacements.
  helm upgrade → rolling update → zero downtime guaranteed by PDB.
  helm rollback → one command, ~30 seconds to previous version.
  K8s DNS → app scaling is invisible to Kong, no deck sync needed.
  K8s RBAC → fine-grained access control per team per namespace.
  Prometheus sidecar → metrics out of the box.
  GitOps → Helm values + kong.yml both in Git, CI/CD applies both.
  35 out of 36 checklist items satisfied.

The system manages itself.
You set it up once. It runs.
```

