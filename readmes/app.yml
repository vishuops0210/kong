## 7. Incident Management

### Severity Classification

```
SEV-1  Kong completely unreachable. All APIs down.
       Response: 15 min. Escalation: On-call → Lead → Manager.

SEV-2  Kong degraded. Error rate > 5% or P99 latency > 1s.
       Response: 30 min. Escalation: On-call → Lead.

SEV-3  Single route broken. Other routes unaffected.
       Response: 2 hours. Escalation: On-call.

SEV-4  Config drift detected. No user impact.
       Response: Next business day.
```

### Communication Template

```
[SEV-X] Kong API Gateway — <short description>

Status:      Investigating / Identified / Monitoring / Resolved
Impact:      <which routes affected, estimated user count>
Start time:  <UTC timestamp>
Update:      <what we know, what we are doing>
Next update: in <N> minutes

Incident commander: <name>
```

### Post-Incident RCA Template

```
Summary, Timeline (UTC), Root Cause, Contributing Factors,
Impact (duration + affected routes + user count),
What went well, What went wrong,
Action items (owner + due date), Preventive measures.

Conducted within 48 hours of resolution.
```
