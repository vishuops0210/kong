## PHASE 2 — Register Your Apps with Kong

This phase is **identical regardless of which approach you used in Phase 1.**

EC2, EKS, or Fargate — it does not matter.
Kong is running. Now you tell it where your apps live.
The apps themselves are not touched. Not redeployed. Not modified.

```
Your app is running somewhere:
  → Same EKS cluster (K8s Service DNS)
  → Different EC2 (IP address)
  → Another AWS account (private link endpoint)
  → On-prem (VPN-connected IP)
  → Anywhere reachable from Kong's network

You write a kong.yml describing it.
You run deck sync.
Kong starts routing to it immediately.
```

### The kong.yml — Telling Kong About Your App

```yaml
# kong.yml
# This file lives in Git.
# Apply with:   deck gateway sync kong.yml
# Preview with: deck gateway diff kong.yml
# Validate:     deck gateway validate kong.yml

_format_version: "3.0"

# ─────────────────────────────────────────────────────────────────────────────
# UPSTREAM — the load balancer pool for your app
#
# target can be:
#   → an IP:port          (bare metal or EC2)
#   → a DNS name:port     (K8s Service, Cloud Map, Route 53)
#   → a hostname:port     (anything DNS-resolvable from Kong's network)
#
# Kong resolves DNS per request.
# App scales up → DNS updates → Kong picks up new instances automatically.
# No deck sync needed when your app scales.
# ─────────────────────────────────────────────────────────────────────────────
upstreams:
  - name: my-app-upstream
    algorithm: round-robin
    slots: 100

    healthchecks:
      active:
        type: http
        http_path: /health          # Kong pings this on each target every 10s
        timeout: 5
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3

      passive:
        type: http
        healthy:
          successes: 5
          http_statuses: [200, 201]
        unhealthy:
          http_failures: 5
          http_statuses: [500, 502, 503, 504]

    targets:
      # If your app is on EC2 or bare metal — use IP:port
      - target: 10.0.1.50:3000
        weight: 100

      # If your app is on Kubernetes — use Service DNS
      # - target: my-app-service.my-namespace.svc.cluster.local:80
      #   weight: 100

      # Scale to 3 instances? Just add targets. deck sync. Done.
      # - target: 10.0.1.51:3000
      #   weight: 100
      # - target: 10.0.1.52:3000
      #   weight: 100

# ─────────────────────────────────────────────────────────────────────────────
# SERVICE — register your app with Kong
# ─────────────────────────────────────────────────────────────────────────────
services:
  - name: my-app
    host: my-app-upstream     # points to the upstream above — enables load balancing
    port: 80
    protocol: http
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    retries: 3

    routes:
      - name: my-app-route
        paths:
          - /api
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        strip_path: false
        protocols:
          - http
          - https

    plugins:
      # Auth — every request must carry a valid JWT
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          hide_credentials: true    # strip JWT before forwarding to your app

      # Rate limiting — shared counter across all Kong nodes via Redis
      - name: rate-limiting
        config:
          minute: 60
          hour: 1000
          policy: redis
          limit_by: consumer
          redis:
            host: your-elasticache-endpoint.cache.amazonaws.com
            port: 6379
            ssl: true
          fault_tolerant: true
          hide_client_headers: false

      # Security headers — strip stack info, add protection headers
      - name: response-transformer
        config:
          remove:
            headers:
              - X-Powered-By
              - Server
          add:
            headers:
              - "X-Content-Type-Options:nosniff"
              - "X-Frame-Options:DENY"
              - "X-XSS-Protection:1; mode=block"

      # Logging — ship every request to your log collector
      - name: http-log
        config:
          http_endpoint: http://your-log-collector:8080/logs
          method: POST
          timeout: 1000
          keepalive: 1000

# ─────────────────────────────────────────────────────────────────────────────
# CONSUMERS — who is allowed to call your API
# Each caller gets their own JWT credential and their own rate limit bucket.
# ─────────────────────────────────────────────────────────────────────────────
consumers:
  - username: web-frontend
    custom_id: frontend-app-001
    jwt_secrets:
      - key: frontend-issuer
        secret: "pull-this-from-vault-never-hardcode"

  - username: mobile-app
    custom_id: mobile-app-001
    jwt_secrets:
      - key: mobile-issuer
        secret: "pull-this-from-vault-never-hardcode"

  - username: internal-service
    custom_id: internal-svc-001
    jwt_secrets:
      - key: internal-issuer
        secret: "pull-this-from-vault-never-hardcode"
```

### Apply the Config

```bash
# EKS — port-forward admin API then sync
kubectl port-forward svc/kong-kong-admin 8001:8001 -n kong &
deck gateway sync kong.yml --kong-addr http://localhost:8001

# EC2 — admin API is on 127.0.0.1:8001 on the node, reach via bastion
ssh -L 8001:localhost:8001 ec2-user@<bastion-ip>
deck gateway sync kong.yml --kong-addr http://localhost:8001

# ECS — use VPC endpoint or bastion to reach admin task
deck gateway sync kong.yml --kong-addr http://<internal-alb-for-admin>:8001
```

### Verify Routing Works

```bash
export KONG=http://<your-kong-alb-dns>

# No token — Kong blocks it before it reaches your app
curl $KONG/api/users
# {"message":"Unauthorized"}  ← 401, Kong rejected it

# With a valid JWT
curl $KONG/api/users \
  -H "Authorization: Bearer <your-jwt-token>"
# Your app's response — Kong routed it, authenticated it, logged it

# Hit rate limit (after 60 requests in a minute)
# {"message":"API rate limit exceeded"}  ← 429, Kong blocked it

# Your app never saw the blocked requests.
# Your app never validated the JWT.
# Your app never wrote a single log line for this.
# Kong handled all of it.
```

### What Kong Injects Into Your App's Request

After JWT validation passes, Kong adds these headers before forwarding to your app:

```
X-Consumer-Username:  web-frontend
X-Consumer-Custom-Id: frontend-app-001
X-Forwarded-For:      <real client IP>
X-Forwarded-Host:     api.yourcompany.com
X-Forwarded-Proto:    https
```

Your app reads `X-Consumer-Username` to know which caller it is.
Your app reads `X-Forwarded-For` to know the real client IP.
The JWT itself is stripped — your app never sees the raw token.

