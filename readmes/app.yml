## 6. HA, RTO & RPO

```
┌──────────────────────┬────────────────────────────────────────────────────┐
│ Failure              │ EKS Response                                       │
├──────────────────────┼────────────────────────────────────────────────────┤
│ Kong pod crashes     │ K8s restarts pod. RTO: ~10 seconds.                │
│ AZ goes down         │ 2 pods in other AZs keep serving.                  │
│                      │ HPA adds replacement pods. RTO: ~30 seconds.       │
│ RDS primary fails    │ Multi-AZ auto-failover. Same DNS endpoint.         │
│                      │ Kong reconnects. RTO: ~60 seconds.                 │
│                      │ Kong serves from memory cache during failover.     │
│ Redis fails          │ fault_tolerant:true — requests pass through.       │
│                      │ Rate limits briefly unenforced. RTO: ~30 seconds.  │
│ Full cluster failure │ Restore from RDS snapshot. RTO: ~15 minutes.      │
├──────────────────────┼────────────────────────────────────────────────────┤
│ Agreed RTO           │ < 5 minutes for pod/AZ failure                     │
│ Agreed RPO           │ < 5 minutes (RDS automated backups every 5 min)    │
└──────────────────────┴────────────────────────────────────────────────────┘
```

### Firedrill Schedule

```
Quarterly  → kubectl delete pod <kong-pod>
             Expected: pod restarts in 10s, zero traffic drop
             Evidence: kubectl get pods showing restart + timestamp

Semi-annual → cordon + drain one AZ's nodes
              Expected: traffic continues via other 2 AZs
              Evidence: ALB access logs showing zero dropped requests

Annual     → trigger RDS Multi-AZ failover
             Expected: Kong reconnects within 60s
             Evidence: Kong error logs showing reconnect timestamp

Annual     → full restore from RDS snapshot to new instance
             Expected: full config restored, deck diff shows zero drift
```

